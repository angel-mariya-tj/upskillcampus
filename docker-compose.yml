version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypsql}
      POSTGRES_DB: ${DB_NAME:-servanta}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-servanta}
      DB_PASSWORD: ${DB_PASSWORD:-mypsql}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_for_servanta_marketplace}
      NODE_ENV: ${NODE_ENV:-production}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_servanta123}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-servantarazorpaysecretkey123}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-servanta_webhook_secret_test}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@servanta.com}
      FRONTEND_URL: http://localhost
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
